<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>源码工作台</title><script>try{document.documentElement.dataset.theme=localStorage.getItem('source-theme')||'light'}catch{}</script><link rel="stylesheet" href="style.css"></head>
<body><header><button data-action="sidebar" title="显示或隐藏文件与符号" aria-label="显示或隐藏文件与符号">☰</button><strong id="title"></strong><span class="badge">源码工作台</span><button data-action="entry" title="回到主入口函数" aria-label="回到主入口函数">⌂</button><button data-action="back" title="后退 Alt+←">←</button><button data-action="forward" title="前进 Alt+→">→</button><button id="quick" data-action="search" title="搜索文件、符号和全文 Ctrl/⌘ P">⌕ <span>文件 / 符号 / 全文</span><kbd>⌘ P</kbd></button><button data-action="documents" title="关键文档 · 中文概要与译文" aria-label="关键文档">文</button><button data-action="chains" title="已分析的关键调用链">⌁</button><button data-action="theme" title="切换日夜主题">◐</button><button data-action="fullscreen" title="全屏">⛶</button><button data-action="help" title="使用帮助与分析范围">?</button></header>
<div id="workspace"><aside id="left"><div class="pane-title">项目文件 <button data-action="hide-left" title="隐藏文件侧栏" aria-label="隐藏文件侧栏">×</button><button data-action="bookmarks" title="查看书签">☆</button></div><nav class="segmented side-tabs"><button data-side-tab="files" class="active">文件</button><button data-side-tab="git">Git 历史</button></nav><section id="history-sidebar"><div class="segmented"><button data-history-scope="file">当前文件</button><button data-history-scope="all" class="active">整个项目</button></div><input id="history-filter" placeholder="搜索提交或 SHA" aria-label="搜索 Git 提交"><small id="history-scope-note"></small><nav id="history-list"></nav></section><input id="file-filter" aria-label="过滤文件" placeholder="过滤文件名或路径"><nav id="tree"></nav><div class="pane-title">当前文件符号 <span id="outline-count"></span></div><input id="symbol-filter" aria-label="过滤当前文件符号" placeholder="类、方法、函数…"><nav id="outline"></nav></aside><div class="resizer" id="left-resizer" role="separator" aria-label="调整文件栏宽度"></div>
<main><nav id="tabs"></nav><div id="code-toolbar"><span id="breadcrumb"></span><button data-action="file-intro" title="查看文件介绍" aria-label="查看文件介绍">ⓘ</button><button data-action="find" title="文件内查找 Ctrl/⌘ F">⌕</button><button data-action="line" title="跳到行 Ctrl/⌘ L">↧</button><button data-action="bookmark" title="添加或移除当前行书签">☆</button><button data-action="wrap" title="自动换行">↵</button><button data-action="copy" title="复制当前函数或全文">⧉</button><button data-action="editor" title="在 VS Code 打开真实文件">↗</button><button data-action="inspector" title="显示或隐藏关系与讲解">▥</button><button data-action="graph" title="显示或隐藏调用图">⌁</button></div><div id="findbar" hidden><input id="find-input" placeholder="查找当前文件文本" aria-label="查找当前文件文本"><button data-action="find-prev" title="上一个匹配">↑</button><button data-action="find-next" title="下一个匹配">↓</button><span id="find-count"></span><button data-action="find-close" title="关闭查找">×</button></div><div id="doc-tabs" hidden></div><div id="code" tabindex="0" aria-label="源代码"></div><div class="resizer horizontal" id="graph-resizer" role="separator" aria-label="调整调用图高度"></div><section id="graph-pane"><div class="pane-title"><strong id="graph-title">调用关系</strong><div class="segmented"><button data-graph="both" class="active">调用</button><button data-graph="types">类 / 接口</button><button data-graph="imports">文件依赖</button></div><button data-action="depth" title="切换一层或两层调用">1 层</button><button data-action="zoom-out" title="缩小图">−</button><button data-action="zoom-in" title="放大图">+</button><button data-action="graph-fullscreen" title="全屏调用图" aria-label="全屏调用图" aria-pressed="false">⛶</button><button data-action="graph-hide" title="隐藏调用图" aria-label="隐藏调用图">×</button></div><div id="graph"></div><small id="graph-caption"></small></section></main>
<div class="resizer" id="right-resizer" role="separator" aria-label="调整关系栏宽度"></div><aside id="right"><div class="pane-title">关系与讲解<button data-action="hide-right" title="隐藏讲解侧栏" aria-label="隐藏讲解侧栏">×</button></div><div id="symbol-head"></div><nav id="relation-tabs" class="segmented"><button data-panel="explain" class="active">讲解</button><button data-panel="references">引用</button><button data-panel="callers">调用者</button><button data-panel="callees">调用目标</button></nav><div id="inspector"></div></aside></div>
<footer><span id="status" role="status"></span><span id="coverage"></span></footer>
<dialog id="search-dialog"><div class="dialog-bar"><div class="segmented"><button data-search="files" class="active">文件</button><button data-search="symbols">符号</button><button data-search="text">全文</button><button data-search="explained">已讲解</button><button data-search="chains">调用链讲解</button><button data-search="documents">中文文档</button><button data-search="bookmarks">书签</button></div><button data-action="search-close" title="关闭">×</button></div><input id="search-input" aria-label="搜索" placeholder="输入名称；全文搜索按 Enter"><small id="search-status"></small><nav id="results"></nav></dialog>
<dialog id="info-dialog"><button data-action="info-close" class="close" title="关闭">×</button><div id="info"></div></dialog>
<dialog id="history-dialog"><div class="history-header"><strong>Git 历史与代码差异</strong><button data-history-close title="关闭 Git 差异" aria-label="关闭 Git 差异">×</button></div><div id="history-content"></div></dialog><script src="history-view.js"></script><script src="data.js"></script><script src="app.js"></script></body></html>
