<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><script>document.documentElement.classList.add('guide-loading');try{document.documentElement.dataset.theme=localStorage.getItem('guide-theme')||'light';}catch{document.documentElement.dataset.theme='light';}</script><style>html.guide-loading body{visibility:hidden}html{background:#f4f8fa}html[data-theme=dark]{background:#17232e}</style><meta name="viewport" content="width=device-width, initial-scale=1"><title>项目架构图解</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="walkthrough.css"><link rel="stylesheet" href="lesson.css"></head>
<body>
<header class="site-header"><button id="toggle-files" aria-expanded="true" aria-controls="project-sidebar">项目导航</button><a id="project-home" href="#overview">项目架构</a><nav id="breadcrumbs" aria-label="当前层级"></nav><span id="revision"></span></header>
<aside id="project-sidebar" aria-label="项目导航"><div class="sidebar-tabs"><button id="nav-tab" aria-pressed="true">架构导览</button><button id="files-tab" aria-pressed="false">项目文件</button><button id="history-tab" aria-pressed="false">Git 历史</button></div><div id="architecture-panel"><p class="sidebar-help">从整体到实现，点击进入图解。</p><nav id="architecture-tree" aria-label="架构层级"></nav></div><div id="files-panel" hidden><input id="file-query" type="search" aria-label="搜索项目文件" placeholder="文件名 / 路径 · ⌘/Ctrl P"><small id="file-count"></small><div id="file-tree"></div><p id="file-info" role="status"></p><a id="file-original" hidden target="_blank" rel="noopener">打开原文件</a></div><div id="history-panel" hidden><a href="#history">分支与关键改动</a><input id="history-query" type="search" aria-label="搜索提交" placeholder="提交 / SHA / 作者 / 文件"><select id="history-branch" aria-label="筛选分支"></select><label class="history-key"><input id="history-key-only" type="checkbox">只看有解读的提交</label><small id="history-count"></small><nav id="history-log" aria-label="提交历史"></nav></div></aside><main tabindex="-1"></main>
<dialog id="source-dialog" aria-labelledby="source-title"><div class="source-head"><div><strong id="source-title"></strong><small id="source-meta"></small></div><button id="close-source">关闭 · Esc</button></div>
<div class="source-location"><span id="source-location"></span><button id="location-copy">复制路径:行</button><a id="source-file" target="_blank" rel="noopener">打开原文件</a><select id="source-editor" aria-label="本地编辑器"><option value="vscode">VS Code</option><option value="cursor">Cursor</option></select><a id="open-editor">在编辑器中定位</a></div>
<div class="source-toolbar"><label>行 <input id="source-line" type="number" min="1" value="1"></label><button id="jump-source">跳转</button><button id="source-key">回到关键行</button><label>查找 <input id="source-query" type="search" placeholder="⌘/Ctrl F · 文本"></label><button id="previous-source">上一处</button><button id="find-source">下一处</button><span id="source-matches" role="status"></span><button id="source-wrap" aria-pressed="false">自动换行</button><button id="source-copy">复制源码</button></div><nav id="source-related" aria-label="关联架构讲解"></nav><pre id="source-code" tabindex="0" aria-label="源码内容"></pre><div id="source-status" role="status"></div><p class="source-hint">原文件是本机当前版本，可能与快照不同。编辑器定位需要安装对应应用；HTTP 页面可能限制 file 链接，可复制路径打开。</p></dialog>
<script src="data.js"></script><script src="visuals.js"></script><script src="source.js"></script><script src="files.js"></script><script src="history.js"></script><script src="walkthrough.js"></script><script src="lesson.js"></script><script src="app.js"></script>
</body></html>
